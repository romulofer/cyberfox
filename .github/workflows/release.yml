name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: flutter build linux --release
            asset: cyberfox-linux.tar.gz

          - os: windows-latest
            build_cmd: flutter build windows --release
            asset: cyberfox-windows.zip

          - os: macos-latest
            build_cmd: flutter build macos --release
            asset: cyberfox-macos.zip

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: beta

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: ${{ matrix.build_cmd }}

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf cyberfox-linux.tar.gz -C build/linux/x64/release bundle/

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release -DestinationPath cyberfox-windows.zip

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: cd build/macos/Build/Products/Release && zip -r $GITHUB_WORKSPACE/cyberfox-macos.zip cyberfox.app

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
