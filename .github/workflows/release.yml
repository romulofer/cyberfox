name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            build_cmd: flutter build linux --release
            binary: build/linux/x64/release/bundle/cyberfox
            asset: cyberfox-linux

          - os: windows-latest
            build_cmd: flutter build windows --release
            binary: build/windows/x64/runner/Release/cyberfox.exe
            asset: cyberfox-windows.exe

          - os: macos-latest
            build_cmd: flutter build macos --release
            binary: build/macos/Build/Products/Release/cyberfox.app/Contents/MacOS/cyberfox
            asset: cyberfox-macos

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: beta

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev

      - run: flutter pub get

      - run: ${{ matrix.build_cmd }}

      - name: Stage binary
        shell: bash
        run: cp "${{ matrix.binary }}" "${{ matrix.asset }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: artifacts

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
